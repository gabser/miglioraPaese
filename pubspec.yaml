name: fanta_comune
description: "Migliora Paese: prototipo Flutter web di gioco civico locale."
version: 0.1.0+1
publish_to: "none"

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.47.5"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  bloc: ^8.1.4
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  shared_preferences: ^2.2.3
  go_router: ^14.2.8
  http: ^1.6.0
  provider: ^6.1.2
  flutter_svg: ^2.3.0
  flutter_map: 8.3.2
  latlong2: ^0.10.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/manrope/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/manrope/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/manrope/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/manrope/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/manrope/Manrope-ExtraBold.ttf
          weight: 800
  assets:
    - assets/brand/
    - assets/icons/
    - assets/illustrations/
    - assets/tokens.json
    - assets/map/tuglie/
