      type: string
      enum: [improve, stable, worsen]
    HypothesisConfidence:
      type: string
      enum: [gutFeeling, considered, convinced]
    MotivationKey:
      type: string
      enum:
        - visibleActions
        - recentDecline
        - seasonality
        - unmetPromises
        - personalExperience
