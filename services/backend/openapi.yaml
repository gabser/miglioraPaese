openapi: 3.1.0
info:
  title: Migliora Paese API
  version: 0.11.0
  description: >-
    Pilot API backed by durable SQLite state. User-specific resources use a
    signed anonymous session issued by the server in an HttpOnly cookie;
    client-provided userId values are ignored. Staging can be restricted to a
    single municipality and requires an explicit human moderation decision.
    Aggregate insight counts and distributions are suppressed below the
    configured privacy threshold. A session can erase its pseudonymous links,
    votes, predictions and outcomes; published suggestion text is retained
    without a link to the deleted session.
servers:
  - url: http://localhost:8787
security:
  - {}
  - AnonymousSession: []
paths:
  "/v1/fantasy/municipalities/{municipalityId}/leagues":
    "get":
      "operationId": "listFantasyLeagues"
      "parameters":
        -
          "$ref": "#/components/parameters/MunicipalityId"
      "description": "Private, session-owned synthetic pilot league scoped to one municipality and season. Generated pseudonyms only. Competitors must join before the first season lock; later members are spectators. Ranking hidden below three competitors. Ties share rank with stable member-ID order; points derive only from frozen server results and transfer ledger. No teams, predictions or internal identities are exposed. Owner exit/deletion archives the league and revokes all invites. Invite rotation invalidates all prior invites; raw tokens are returned once, stored only as SHA-256 hashes and never logged. Join guesses are limited to five per minute per enrolled session, persisted across restarts. Anonymous sessions do not prevent multiple identities."
      "responses":
        "200":
          "description": "Accepted league operation."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/FantasyLeagueList"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "429":
