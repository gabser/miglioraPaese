openapi: 3.1.0
info:
  title: Migliora Paese API
  version: 0.3.0
  description: >-
    Local pilot API for replacing Flutter in-memory repositories. The optional
    userId is client-controlled in legacy scaffold calls and is not authentication.
    Proposal POST with a proposalBearer token overrides userId with the session identity
    and scopes Idempotency-Key to session and canonical municipality. Private own and
    submission lookup require the token. Legacy calls without bearer preserve their
    previous behavior and do not provide private recovery or authoritative identity.
    Fantasy v1 is an explicit opt-in PostgreSQL feature with synthetic fixed-calendar
    fixtures. All private fantasy operations require proposalBearer, reject userId
    commands and return cache-control no-store. Local outcome publication requires
    a separately configured X-Admin-Token and rejects cross-origin requests.
    Bearer game calls use server identity; private results and reputation require it.
    Public legacy leaderboard excludes bearer session and account identities.
    Accounts require ACCOUNT_ENABLED=true with PostgreSQL and EMAIL_DELIVERY=simulated;
    no real email delivery or code retrieval HTTP endpoint exists.
    Health/readiness expose optional CANDIDATE_ID, persistence and effective non-secret
    feature flags. X-Request-ID is a server-generated UUID; incoming IDs are ignored.
    Local metrics/logs use static route names only. OPS_LOCAL_ENABLED requires explicit
    synthetic loopback PostgreSQL and an external HMAC erasure journal; uncertain
    journal or restored-copy state blocks readiness and data exposure. Fantasy erase
    is scoped fantasy removal, not full account closure or session revocation.
servers:
  - url: http://127.0.0.1:8787
paths:
  "/v1/municipalities/{municipalityId}/measurements": {
    "get": {
      "operationId": "measurementOverview",
      "description": "Opt-in MEASUREMENTS_ENABLED, PostgreSQL only. Cache-Control no-store. Public approved projection; deadline reconciliation in the same transaction.  seasonId/matchdayId must be supplied together; default active, next future or latest past season at server time.",
      "parameters": [
        {
          "name": "municipalityId",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string",
            "maxLength": 128
          }
        },
        {
          "name": "seasonId",
          "in": "query",
          "required": false,
          "schema": {
            "type": "string",
            "maxLength": 128
          }
        },
        {
          "name": "matchdayId",
          "in": "query",
          "required": false,
          "schema": {
            "type": "string",
            "maxLength": 128
          }
        }
      ],
      "responses": {
        "200": {
          "description": "Successful immutable replay or current scoped response",
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/MeasurementOverview"
              }
            }
          }
        },
        "400": {
          "description": "invalid_field or malformed JSON"
        },
        "401": {
          "description": "account_required / session_expired"
        },
        "403": {
          "description": "measurements_forbidden / self_review / competitive_conflict"
        },
        "404": {
          "description": "not_found or disabled feature"
        },
        "409": {
          "description": "measurement_revision_conflict / idempotency_conflict / protocol_locked / insufficient_evidence / contradictory_evidence / incomparable_evidence / direction_mismatch / evidence_expired"
        },
        "413": {
          "description": "JSON exceeds 64 KiB"
        }
      }
    }
  }
