      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SuggestedProblem"
    SubmitSuggestedProblemRequest:
      type: object
      description: >-
        Text is trimmed and limited in Unicode code points, without truncation.
        Location is optional only for legacy clients; new clients require an explicit
        choice. Identical titles are accepted; similarity is advisory.
      required: [title, description, category]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, minLength: 1, maxLength: 1000 }
        location:
          $ref: "#/components/schemas/NullableProposalLocation"
        category:
          $ref: "#/components/schemas/ProblemKey"
        userId: { type: string, minLength: 1, maxLength: 128 }
    NullableProposalLocation:
      description: Explicit place; null only for legacy proposals with no recorded place.
      oneOf:
        - $ref: "#/components/schemas/ProposalLocation"
        - type: object
          nullable: true
          enum: [null]
    ProposalLocation:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind]
          properties:
            kind: { type: string, enum: [municipality] }
        - type: object
          additionalProperties: false
          required: [kind, label]
          properties:
            kind: { type: string, enum: [specific] }
            label: { type: string, minLength: 1, maxLength: 120 }
            civic: { type: string, maxLength: 20 }
            reference: { type: string, maxLength: 200 }
    VoteSuggestedProblemRequest:
      type: object
      required: [vote]
      properties:
        vote:
          $ref: "#/components/schemas/VoteChoice"
        userId: { type: string, minLength: 1, maxLength: 128 }
