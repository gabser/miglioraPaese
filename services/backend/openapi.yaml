    ProposalCapabilities:
      type: object
      additionalProperties: false
      required: [proposalLocation, publicDetail, privateSubmissionLookup, scopedIdempotency, revocation, sessionRequiredForRecovery]
      properties:
        proposalLocation: { const: true }
        publicDetail: { const: true }
        privateSubmissionLookup: { const: true }
        scopedIdempotency: { const: true }
        revocation: { const: true }
        sessionRequiredForRecovery: { const: true }
    ProposalSession:
      type: object
      required: [submissionScope, capabilities]
      properties:
        submissionScope: { type: string, format: uuid }
        capabilities:
          $ref: '#/components/schemas/ProposalCapabilities'
    ProposalSessionBootstrap:
      allOf:
        - $ref: '#/components/schemas/ProposalSession'
        - type: object
          required: [token]
          properties:
            token: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
        message:
          type: string
        fieldErrors:
          description: Public field paths and stable validation codes; additive, no private moderation reasons.
          type: object
          additionalProperties:
            type: string
            enum: [invalid_text, too_long, invalid_choice, invalid_location]
    HealthResponse:
      allOf:
        - $ref: '#/components/schemas/RuntimeDiagnostics'
        - type: object
          required: [status]
          properties:
            status: {const: ok}
    RuntimeDiagnostics:
      type: object
      required: [candidateId, version, persistence, profile, features]
      properties:
        candidateId: {type: [string, 'null'], pattern: '^[a-f0-9]{64}$'}
        version: {const: '0.2.0'}
        persistence: {enum: [memory, postgres]}
        profile: {enum: [legacy-local, synthetic-local]}
        features:
          type: object
          additionalProperties: false
          required: [fantasy, accounts, missions, review, measurements, leagueContinuity, cooperation, opsLocal]
          properties:
            fantasy: {type: boolean}
            accounts: {type: boolean}
            missions: {type: boolean}
            review: {type: boolean}
            measurements: {type: boolean}
            leagueContinuity: {type: boolean}
            cooperation: {type: boolean}
            opsLocal: {type: boolean}
    ActivationState:
      type: string
      enum: [active, collectingSignals, newMunicipality]
    ActivationResponse:
      type: object
      required: [municipalityId, state]
      properties:
        municipalityId:
          type: string
        state:
          $ref: "#/components/schemas/ActivationState"
