    MissionList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Mission' } }
    MissionDetail:
      type: object
      required: [mission]
      properties:
        mission: { $ref: '#/components/schemas/Mission' }
    Mission:
      type: object
      required: [id, placeId, municipalityId, zoneId, title, area, protocol, windowId, startsAt, endsAt, durationMinutes, availableSlots, rewardXp, synthetic]
      properties:
        placeId: { type: [string, 'null'], description: Public catalog place identity; absent in older responses. }
        id: { type: string }
        municipalityId: { type: string }
        zoneId: { type: string }
        title: { type: string }
        area:
          type: object
          required: [label, boundary, public]
          properties:
            label: { type: string }
            boundary: { type: string }
            public: { const: true }
        protocol:
          type: object
          required: [id, version, instructions, photoPoints, minPhotos, indicator, threshold]
          properties:
            id: { type: string }
            version: { type: integer, minimum: 1 }
            instructions: { type: array, items: { type: string } }
            photoPoints:
              type: array
              items:
                type: object
                required: [id, label]
                properties:
                  id: { type: string }
                  label: { type: string }
            minPhotos: { type: integer, minimum: 0, maximum: 3 }
            indicator: { type: string }
            threshold: { type: string }
            measurementDefinition: { $ref: '#/components/schemas/MissionMeasurementDefinition' }
        windowId: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        durationMinutes: { type: integer }
        availableSlots: { type: integer, minimum: 0 }
        rewardXp: { const: 10, description: Recognition only after future human validation; never awarded by submission. }
        synthetic: { const: true }
    MissionBookingRequest:
      type: object
      additionalProperties: false
      required: [windowId, idempotencyKey]
      properties:
        windowId: { type: string }
        idempotencyKey: { type: string, pattern: '^[A-Za-z0-9_-]{8,128}$' }
    MissionBooking:
      type: object
      required: [id, missionId, windowId, protocolVersion, status, expiresAt, revision]
      properties:
        id: { type: string, format: uuid }
        missionId: { type: string }
        windowId: { type: string }
        protocolVersion: { type: integer }
        status: { type: string, enum: [active, released, expired, submitted] }
        expiresAt: { type: string, format: date-time }
        revision: { type: integer }
        replicationRequestId: { type: [string, 'null'], format: uuid, description: Server owned requested replica relation; null for base. }
    CurrentMissionBooking:
      type: object
      required: [booking]
      properties:
        booking:
          oneOf:
            - $ref: '#/components/schemas/MissionBooking'
            - type: 'null'
    MissionRevisionRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision]
      properties:
        expectedRevision: { type: integer, minimum: 1 }
    MissionUploadRequest:
      type: object
      additionalProperties: false
      required: [mimeType, totalBytes, synthetic, idempotencyKey]
      properties:
        mimeType: { const: image/png }
        totalBytes: { type: integer, minimum: 1, maximum: 2097152 }
        synthetic: { const: true }
        idempotencyKey: { type: string, pattern: '^[A-Za-z0-9_-]{8,128}$' }
    MissionChunkRequest:
      type: object
      additionalProperties: false
      required: [offset, dataBase64]
      properties:
        offset: { type: integer, minimum: 0 }
        dataBase64: { type: string, maxLength: 43692, description: Canonical base64 of 1 to 32768 bytes. Same offset and bytes replay; different bytes conflict. }
    MissionEmptyCommand:
      type: object
      additionalProperties: false
    MissionUpload:
      type: object
      required: [id, bookingId, mimeType, totalBytes, receivedBytes, status, revision, expiresAt]
      properties:
        id: { type: string, format: uuid }
        bookingId: { type: string, format: uuid }
        mimeType: { const: image/png }
        totalBytes: { type: integer }
        receivedBytes: { type: integer }
        status: { type: string, enum: [uploading, complete] }
        revision: { type: integer }
        expiresAt: { type: string, format: date-time }
        width: { type: integer, maximum: 4096 }
        height: { type: integer, maximum: 4096 }
        sha256: { type: string, description: Present for complete uploads; digest of sanitized pixels file. }
        sanitizedBytes: { type: integer, description: Complete upload sanitized PNG length. }
    MissionProof:
      allOf:
        - $ref: '#/components/schemas/MissionUpload'
        - type: object
          required: [dataBase64, sha256, sanitizedBytes]
          properties:
            dataBase64: { type: string, description: Private sanitized PNG; no public URL, EXIF, text or location metadata. }
    MissionObservationRequest:
      type: object
      additionalProperties: false
      required: [idempotencyKey, expectedRevision, protocolVersion, answer, notes, proofIds]
      properties:
        measurement:
          type: [object, 'null']
          additionalProperties: false
          required: [value]
          properties:
            value: { type: number, minimum: -1000000000, maximum: 1000000000 }
          description: Required for noIssue/visibleWaste with quantitative protocol, absent/null for nonObservable/unsure. Legacy bodies omit this field to preserve their exact fingerprint.
        idempotencyKey: { type: string, pattern: '^[A-Za-z0-9_-]{8,128}$' }
        expectedRevision: { type: integer, minimum: 1 }
        protocolVersion: { type: integer, minimum: 1 }
        answer: { type: string, enum: [noIssue, nonObservable, unsure, visibleWaste] }
        notes: { type: string, maxLength: 1000 }
        proofIds: { type: array, maxItems: 3, uniqueItems: true, items: { type: string, format: uuid }, description: At least protocol minPhotos for noIssue/visibleWaste; zero allowed for nonObservable/unsure. }
    MissionReceipt:
      type: object
      required: [id, bookingId, missionId, municipalityId, windowId, protocolVersion, status, answer, submittedAt, xpAwarded, proofIds, proofs]
      properties:
        measurement:
          type: object
          required: [value, unit, indicator, protocolId, protocolVersion, recordedAt]
          properties:
            value: { type: number }
            unit: { type: string }
            indicator: { type: string }
            protocolId: { type: string, format: uuid }
            protocolVersion: { type: integer }
            recordedAt: { type: string, format: date-time }
