      "description": "Current signed anonymous session only; client user IDs and points are rejected. Enrollment is idempotent and creates a server-validated draft, never imported demo results. Writes check the expected revision and server lock inside a transaction. Formation changes invalidate confirmation; predictions remain editable before lock. Snapshots are reconciled on restart and after deadlines. Anonymous sessions do not provide cross-device account recovery."
      "parameters":
        -
          "$ref": "#/components/parameters/MunicipalityId"
      "responses":
