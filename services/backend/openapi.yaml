        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          description: Conservative content filter refused this proposal; no entity or receipt is created. Revise the draft manually.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Three saved proposals per author and municipality in an inclusive rolling hour. Idempotent replay does not consume quota. No entity or receipt is created.
          headers:
            Retry-After:
              description: Positive seconds until a new manual attempt may be accepted.
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema:
                type: object
                required: [error, message, retryAfterSeconds]
                properties:
                  error: { type: string, enum: [submission_rate_limited] }
                  message: { type: string }
                  retryAfterSeconds: { type: integer, minimum: 1 }
