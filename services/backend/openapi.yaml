        cardsInTurn: { type: integer, minimum: 0 }
        predictions: { type: integer, minimum: 0 }
        outcomes: { type: integer, minimum: 0 }
        reputationPoints: { type: integer }
        topThemeTitle:
          type: [string, "null"]
    Turn:
      type: object
      required: [id, municipalityId, state, startAt, endAt]
      properties:
        id: { type: string }
        municipalityId: { type: string }
        state:
          type: string
          enum: [open, calculating, closed]
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
    ProblemKey:
      type: string
      enum:
        - lighting
        - potholes
        - waste
        - cleanliness
        - green
        - signage
        - transport
        - parking
        - decor
        - noise
        - safety
        - construction
        - queues
