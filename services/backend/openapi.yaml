          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/FantasyMatchdayResponse"
        "404":
          "$ref": "#/components/responses/NotFound"
  "/v1/fantasy/municipalities/{municipalityId}/matchdays/{matchdayId}":
    "get":
      "operationId": "getFantasyMatchday"
      "description": "Read-only synthetic fantasy fixture. Server time is UTC. A verified source status does not certify real data. Pilot municipality restrictions apply. Calendar dates and catalog survive restarts; expired seasons are not renewed."
      "parameters":
        -
          "$ref": "#/components/parameters/MunicipalityId"
        -
          "name": "matchdayId"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
      "responses":
        "200":
          "description": "Versioned fantasy data with explicit demo provenance."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/FantasyMatchdayResponse"
        "404":
          "$ref": "#/components/responses/NotFound"
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Backend is reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /ready:
    get:
      operationId: getReadiness
      responses:
        "200":
          description: Backend and persistent store are ready to serve traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /metrics:
    get:
      operationId: getMetrics
      responses:
        "200":
          description: Low-cardinality Prometheus metrics without user data.
          content:
            text/plain:
              schema:
                type: string
  /v1/session:
    delete:
      operationId: deleteAnonymousSessionData
      description: >-
        Deletes votes, predictions, fantasy enrollments, drafts, snapshots, quotes, transfer commands, ledger entries, personal reveals, finalizations, reflections and outcomes associated with the current
        anonymous session atomically across legacy and fantasy stores, removes its link from published suggestions and
        expires the session cookie. The operation is idempotent.
      responses:
        "200":
          description: Session data deleted and cookie expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionDeletionResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/municipalities/{municipalityId}/activation:
    get:
      operationId: getMunicipalityActivation
      parameters:
        - $ref: "#/components/parameters/MunicipalityId"
      responses:
        "200":
          description: Activation state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivationResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/municipalities/{municipalityId}/summary:
    get:
      operationId: getCivicLoopSummary
      parameters:
        - $ref: "#/components/parameters/MunicipalityId"
      responses:
        "200":
          description: Civic loop summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CivicLoopSummary"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/municipalities/{municipalityId}/turn:
    get:
      operationId: getCurrentTurn
      parameters:
        - $ref: "#/components/parameters/MunicipalityId"
      responses:
        "200":
          description: Current turn.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Turn"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/municipalities/{municipalityId}/problems:
    get:
      operationId: listProblems
      parameters:
        - $ref: "#/components/parameters/MunicipalityId"
      responses:
        "200":
          description: Problems for the current turn.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Problem"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/municipalities/{municipalityId}/leaderboard:
    get:
      operationId: getLeaderboard
      parameters:
        - $ref: "#/components/parameters/MunicipalityId"
      responses:
        "200":
          description: Leaderboard entries.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/LeaderboardEntry"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/municipalities/{municipalityId}/reputation-history:
    get:
      operationId: getReputationHistory
      parameters:
        - $ref: "#/components/parameters/MunicipalityId"
      responses:
        "200":
          description: Reputation snapshots ordered from the oldest turn.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReputationHistory"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/municipalities/{municipalityId}/next-problems:
    get:
      operationId: listNextProblems
      parameters:
        - $ref: "#/components/parameters/MunicipalityId"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/SuggestedProblemStatus"
        - name: query
          in: query
          schema:
            type: string
            maxLength: 120
      responses:
        "200":
          description: Suggested problems for the selected user view.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuggestedProblemList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: submitSuggestedProblem
      parameters:
        - $ref: "#/components/parameters/MunicipalityId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitSuggestedProblemRequest"
      responses:
        "201":
          description: Created suggested problem.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuggestedProblem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/municipalities/{municipalityId}/next-problems/{problemId}/votes:
    post:
      operationId: voteSuggestedProblem
      parameters:
        - $ref: "#/components/parameters/MunicipalityId"
        - $ref: "#/components/parameters/ProblemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoteSuggestedProblemRequest"
      responses:
        "200":
          description: >-
            Updated suggested problem for the voting user. In moderated pilot
            mode, voting changes the score but cannot approve the proposal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuggestedProblem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/municipalities/{municipalityId}/next-problems/{problemId}/moderation:
    post:
      operationId: moderateSuggestedProblem
      security:
        - ModeratorToken: []
      parameters:
        - $ref: "#/components/parameters/MunicipalityId"
        - $ref: "#/components/parameters/ProblemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModerateSuggestedProblemRequest"
      responses:
        "200":
          description: Moderation decision saved and promotion state updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuggestedProblem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
  /v1/turns/{turnId}/predictions:
    get:
      operationId: listPredictions
      parameters:
        - $ref: "#/components/parameters/TurnId"
      responses:
        "200":
          description: User predictions.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Prediction"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/turns/{turnId}/predictions/{problemId}:
    put:
      operationId: upsertPrediction
      parameters:
        - $ref: "#/components/parameters/TurnId"
        - $ref: "#/components/parameters/ProblemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertPredictionRequest"
      responses:
        "200":
          description: Saved prediction.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prediction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
  /v1/turns/{turnId}/prediction-results:
    get:
      operationId: getPredictionResults
      parameters:
        - $ref: "#/components/parameters/TurnId"
      responses:
        "200":
          description: Saved outcomes indexed by problem in the client mapper.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PredictionResultList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/turns/{turnId}/reputation:
    get:
      operationId: getReputationScore
      parameters:
        - $ref: "#/components/parameters/TurnId"
      responses:
        "200":
          description: Reputation derived from the user's saved outcomes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReputationScore"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/problems/{problemId}/resolve:
    post:
      operationId: resolvePrediction
      parameters:
        - $ref: "#/components/parameters/ProblemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolvePredictionRequest"
      responses:
        "200":
          description: Prediction result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PredictionResolution"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/problems/{problemId}/insight:
    get:
      operationId: getAggregatedInsight
      parameters:
        - $ref: "#/components/parameters/ProblemId"
      responses:
        "200":
          description: Current aggregate of predictions and motivations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AggregatedInsight"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/problems/{problemId}/insight-history:
    get:
      operationId: getInsightHistory
      parameters:
        - $ref: "#/components/parameters/ProblemId"
      responses:
        "200":
          description: Aggregate snapshots ordered by turn.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsightHistory"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/problems/{problemId}/critical-insights:
    get:
      operationId: getCriticalInsights
      parameters:
        - $ref: "#/components/parameters/ProblemId"
        - name: userChoice
          in: query
          schema:
            $ref: "#/components/schemas/PredictionChoice"
        - name: userConfidence
          in: query
          schema:
            $ref: "#/components/schemas/HypothesisConfidence"
        - name: userReflectionIndex
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 20
      responses:
        "200":
          description: Lightweight comparison cards for the user's context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CriticalInsightList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    AnonymousSession:
      type: apiKey
      in: cookie
      name: mp_anon
      description: >-
        Signed opaque identifier issued by the server. Browsers cannot read it
        because the cookie is HttpOnly; credentialed requests send it back.
    ModeratorToken:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Operator credential supplied by the staging secret manager.
  parameters:
    MunicipalityId:
      name: municipalityId
      in: path
      required: true
      description: "Canonical slug; known comune: aliases are accepted for compatibility."
      schema:
        type: string
    ProblemId:
      name: problemId
      in: path
      required: true
      schema:
        type: string
    TurnId:
      name: turnId
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: Invalid JSON, field, enum or query parameter.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Origin is not allowed by the local CORS policy.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid moderator credential.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Requested municipality, turn, problem or route was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Duplicate or incompatible domain state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PayloadTooLarge:
      description: JSON body exceeds 64 KiB.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnprocessableEntity:
      description: Suggestion content was rejected by the moderation policy.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: Anonymous identity exceeded the suggestion submission limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Persistent store is not ready.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    "FantasyLeagueMetadata":
      "type": "object"
      "additionalProperties": false
      "required":
        - "id"
        - "seasonId"
        - "municipalityId"
        - "name"
        - "status"
        - "firstLocksAt"
        - "role"
        - "isOwner"
        - "memberCount"
        - "competitiveCount"
        - "minimumParticipants"
      "properties":
        "id":
          "type": "string"
        "seasonId":
          "type": "string"
        "municipalityId":
          "type": "string"
        "name":
          "type": "string"
          "enum":
            - "Amici"
            - "Quartiere"
            - "Comune"
        "status":
          "type": "string"
          "enum":
            - "active"
            - "archived"
        "firstLocksAt":
          "type": "string"
          "format": "date-time"
        "role":
          "type": "string"
          "enum":
            - "competitor"
            - "spectator"
        "isOwner":
          "type": "boolean"
        "memberCount":
          "type": "integer"
        "competitiveCount":
          "type": "integer"
        "minimumParticipants":
          "type": "integer"
          "const": 3
    "FantasyLeagueEntry":
      "type": "object"
      "additionalProperties": false
      "required":
        - "memberId"
        - "pseudonym"
        - "points"
        - "rank"
        - "isCurrentUser"
      "properties":
        "memberId":
          "type": "string"
        "pseudonym":
          "type": "string"
        "points":
          "type": "integer"
        "rank":
          "type": "integer"
          "minimum": 1
        "isCurrentUser":
          "type": "boolean"
    "FantasyLeagueList":
      "type": "object"
      "additionalProperties": false
      "required":
        - "serverTime"
        - "isDemo"
        - "seasonId"
        - "items"
      "properties":
        "serverTime":
          "type": "string"
          "format": "date-time"
        "isDemo":
          "type": "boolean"
        "seasonId":
          "type": "string"
        "items":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/FantasyLeagueMetadata"
    "FantasyLeagueResponse":
      "type": "object"
      "additionalProperties": false
      "required":
        - "serverTime"
        - "isDemo"
        - "seasonId"
        - "league"
      "properties":
        "serverTime":
          "type": "string"
          "format": "date-time"
        "isDemo":
          "type": "boolean"
        "seasonId":
          "type": "string"
        "league":
          "$ref": "#/components/schemas/FantasyLeagueMetadata"
    "FantasyLeagueRanking":
      "type": "object"
      "additionalProperties": false
      "required":
        - "serverTime"
        - "isDemo"
        - "seasonId"
        - "league"
        - "entries"
        - "cooperativeScore"
      "properties":
        "serverTime":
          "type": "string"
          "format": "date-time"
        "isDemo":
          "type": "boolean"
        "seasonId":
          "type": "string"
        "league":
          "$ref": "#/components/schemas/FantasyLeagueMetadata"
        "entries":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/FantasyLeagueEntry"
        "cooperativeScore":
          "type": "null"
    "FantasyLeagueCreate":
      "type": "object"
      "additionalProperties": false
      "required":
        - "name"
        - "idempotencyKey"
      "properties":
        "name":
          "type": "string"
          "enum":
            - "Amici"
            - "Quartiere"
            - "Comune"
        "idempotencyKey":
          "type": "string"
          "pattern": "^[A-Za-z0-9_-]{8,128}$"
    "FantasyLeagueJoin":
      "type": "object"
      "additionalProperties": false
      "required":
        - "token"
      "properties":
        "token":
          "type": "string"
          "pattern": "^[A-Za-z0-9_-]{43}$"
    "FantasyLeagueInviteRequest":
      "type": "object"
      "additionalProperties": false
      "required":
        - "expiresInHours"
      "properties":
        "expiresInHours":
          "type": "integer"
          "minimum": 1
          "maximum": 168
    "FantasyLeagueInviteResponse":
      "type": "object"
      "additionalProperties": false
      "required":
        - "serverTime"
        - "isDemo"
        - "seasonId"
        - "invite"
      "properties":
        "serverTime":
          "type": "string"
          "format": "date-time"
        "isDemo":
          "type": "boolean"
        "seasonId":
          "type": "string"
        "invite":
          "type": "object"
          "additionalProperties": false
          "required":
            - "id"
            - "token"
            - "expiresAt"
          "properties":
            "id":
              "type": "string"
            "token":
              "type": "string"
            "expiresAt":
              "type": "string"
              "format": "date-time"
    "FantasyLeagueLeft":
      "type": "object"
      "additionalProperties": false
      "required":
        - "serverTime"
        - "isDemo"
        - "seasonId"
        - "status"
      "properties":
        "serverTime":
          "type": "string"
          "format": "date-time"
        "isDemo":
          "type": "boolean"
        "seasonId":
          "type": "string"
        "status":
          "type": "string"
          "const": "left"
    "FantasyLeagueRevoked":
      "type": "object"
      "additionalProperties": false
      "required":
        - "serverTime"
        - "isDemo"
        - "seasonId"
        - "status"
      "properties":
        "serverTime":
          "type": "string"
          "format": "date-time"
        "isDemo":
          "type": "boolean"
        "seasonId":
          "type": "string"
        "status":
          "type": "string"
          "const": "revoked"
    "FantasyOutcome":
      "type": "object"
      "additionalProperties": false
      "required":
        - "matchdayId"
        - "cardId"
        - "observed"
        - "sourceLabel"
        - "sourceDate"
        - "sourceStatus"
        - "explanation"
        - "rulesVersion"
        - "version"
        - "isDemo"
        - "publicationId"
        - "publishedAt"
        - "publisherRole"
      "properties":
        "matchdayId":
          "type": "string"
        "cardId":
          "type": "string"
        "observed":
          "type": "string"
          "enum":
            - "improves"
            - "stable"
            - "worsens"
        "sourceLabel":
          "type": "string"
        "sourceDate":
          "type": "string"
          "format": "date-time"
        "sourceStatus":
          "type": "string"
          "const": "verified"
        "explanation":
          "type": "string"
          "minLength": 1
          "maxLength": 1000
        "rulesVersion":
          "type": "string"
        "version":
          "type": "integer"
          "const": 1
        "isDemo":
          "type": "boolean"
        "publicationId":
          "type": "string"
        "publishedAt":
          "type": "string"
          "format": "date-time"
        "publisherRole":
          "type": "string"
          "const": "pilotModerator"
    "FantasyOutcomePublication":
      "type": "object"
      "additionalProperties": false
      "required":
        - "observed"
        - "sourceLabel"
        - "sourceDate"
        - "sourceStatus"
        - "explanation"
        - "rulesVersion"
        - "version"
      "properties":
        "observed":
          "type": "string"
          "enum":
            - "improves"
            - "stable"
            - "worsens"
        "sourceLabel":
          "type": "string"
        "sourceDate":
          "type": "string"
          "format": "date-time"
        "sourceStatus":
          "type": "string"
          "const": "verified"
        "explanation":
          "type": "string"
          "minLength": 1
          "maxLength": 1000
        "rulesVersion":
          "type": "string"
        "version":
          "type": "integer"
          "const": 1
    "FantasyPublishedOutcomeResponse":
      "type": "object"
      "additionalProperties": false
      "required":
        - "serverTime"
        - "isDemo"
        - "outcome"
      "properties":
        "serverTime":
          "type": "string"
          "format": "date-time"
        "isDemo":
          "type": "boolean"
        "outcome":
          "$ref": "#/components/schemas/FantasyOutcome"
    "FantasyScoreBreakdown":
      "type": "object"
      "additionalProperties": false
      "required":
        - "observationPoints"
        - "predictionPoints"
        - "reflectionPoints"
        - "captainMultiplier"
        - "frozenTotal"
        - "reflectionBonus"
        - "total"
      "properties":
        "observationPoints":
          "type": "integer"
          "enum":
            - 0
            - 1
