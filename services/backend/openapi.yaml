          "type": "string",
          "pattern": "^[A-Za-z0-9_-]{8,128}$"
        }
      }
    }
    "FantasyOwnershipOfferCommand": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "targetMemberId",
        "expectedRevision",
        "idempotencyKey"
      ],
      "properties": {
        "targetMemberId": {
          "type": "string",
          "minLength": 1,
          "maxLength": 128
        },
        "expectedRevision": {
          "type": "integer",
          "minimum": 1
        },
        "idempotencyKey": {
          "type": "string",
          "pattern": "^[A-Za-z0-9_-]{8,128}$"
        }
      }
    }
    "FantasyOwnershipResponse": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "serverTime",
        "seasonId",
        "leagueId",
        "revision",
        "offer"
      ],
      "properties": {
        "serverTime": {
          "type": "string",
          "format": "date-time"
        },
        "seasonId": {
          "type": "string"
        },
        "leagueId": {
          "type": "string"
        },
        "revision": {
          "type": "integer",
          "minimum": 1
        },
        "offer": {
          "$ref": "#/components/schemas/FantasyOwnershipOffer"
        }
      }
    }

    CoverageGoal:
      type: object
      additionalProperties: false
      required: [id, title, version, publishedAt, expectedPlaceWindows]
      properties:
        id: { type: string }
        title: { type: string }
        version: { type: integer, minimum: 1 }
        publishedAt: { type: string, format: date-time }
        expectedPlaceWindows: { type: integer, minimum: 0 }
    CooperationCoverage:
      type: object
      additionalProperties: false
      required: [expectedPlaceWindows, validatedPlaceWindows, ratio]
      properties:
        expectedPlaceWindows: { type: integer, minimum: 0 }
        validatedPlaceWindows: { type: integer, minimum: 0 }
        ratio: { type: [number, 'null'], minimum: 0, maximum: 1, description: Null for absent or zero denominator. }
    MunicipalCooperation:
      type: object
      required: [serverTime, municipalityId, seasonId, matchdayId, goal, coverage]
      additionalProperties: false
      properties:
        serverTime: { type: string, format: date-time }
        municipalityId: { type: string }
        seasonId: { type: string }
        matchdayId: { type: string }
        goal: { anyOf: [{ $ref: '#/components/schemas/CoverageGoal' }, { type: 'null' }] }
        coverage: { $ref: '#/components/schemas/CooperationCoverage' }
    LeagueCooperation:
      type: object
      required: [serverTime, municipalityId, seasonId, matchdayId, leagueId, goal, coverage, municipalCoverage]
      additionalProperties: false
      properties:
        serverTime: { type: string, format: date-time }
        municipalityId: { type: string }
        seasonId: { type: string }
        matchdayId: { type: string }
        leagueId: { type: string }
        goal: { anyOf: [{ $ref: '#/components/schemas/CoverageGoal' }, { type: 'null' }] }
        coverage: { $ref: '#/components/schemas/CooperationCoverage' }
        municipalCoverage: { $ref: '#/components/schemas/CooperationCoverage' }
    InboxTarget:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, observationId]
          properties:
            kind: { const: observation }
            observationId: { type: string, format: uuid }
        - type: object
          additionalProperties: false
          required: [kind, evaluationId, seasonId, matchdayId]
          properties:
            kind: { const: evaluation }
            evaluationId: { type: string, format: uuid }
            seasonId: { type: string }
            matchdayId: { type: string }
        - type: object
          additionalProperties: false
          required: [kind, replicationRequestId, missionId]
          properties:
            kind: { const: recheck }
            replicationRequestId: { type: string, format: uuid }
            missionId: { type: string }
        - type: object
          additionalProperties: false
          required: [kind, missionId]
          properties:
            kind: { const: mission }
            missionId: { type: string }
    InboxMessage:
      type: object
      additionalProperties: false
      required: [id, type, title, createdAt, readAt, municipalityId, target]
      properties:
        id: { type: string, format: uuid }
        type: { enum: [integrationRequested, observationApproved, observationRejected, outcomePublished, outcomeCorrected, recheckRequested] }
        title: { type: string }
        createdAt: { type: string, format: date-time }
        readAt: { type: [string, 'null'], format: date-time }
        municipalityId: { type: string }
        target: { $ref: '#/components/schemas/InboxTarget' }
    CooperationInbox:
      type: object
      additionalProperties: false
      required: [serverTime, items, nextCursor, unreadCount]
      properties:
        serverTime: { type: string, format: date-time }
        items: { type: array, items: { $ref: '#/components/schemas/InboxMessage' } }
        nextCursor: { type: [string, 'null'], maxLength: 512 }
        unreadCount: { type: integer, minimum: 0 }
    FollowedPlace:
      type: object
      additionalProperties: false
      required: [placeId, municipalityId]
      properties:
        placeId: { type: string }
        municipalityId: { type: string }
    FollowedPlaceResult:
      type: object
      additionalProperties: false
      required: [placeId, municipalityId, following]
      properties:
        placeId: { type: string }
        municipalityId: { type: string }
        following: { type: boolean }
