      "operationId": "quoteFantasyTransfer"
      "parameters":
        -
          "$ref": "#/components/parameters/MunicipalityId"
      "description": "Signed session only. Quote binds matchday, team revision, catalog and card versions, prices, roles and a five-minute expiry capped at lock. Confirmation revalidates inside one transaction. Two free transfers per matchday, then four penalty points each. A repeated accepted idempotency key returns the original reply, including after lock or restart; another payload with that key conflicts. Failures consume no credits or transfer allowance."
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/FantasyTransferQuoteRequest"
