  /v1/municipalities/{municipalityId}/cooperation:
    get:
      operationId: cooperationMunicipal
      description: Opt-in COOPERATION_ENABLED (false by default). Public anonymous validated place/UTC-window units among explicitly published targets; no event backfill.
      parameters:
        - { name: municipalityId, in: path, required: true, schema: { type: string } }
        - { name: seasonId, in: query, schema: { type: string }, description: Select with matchdayId. }
        - { name: matchdayId, in: query, schema: { type: string }, description: Select with seasonId. }
      responses:
        '200': { description: Coverage, content: { application/json: { schema: { $ref: '#/components/schemas/MunicipalCooperation' } } } }
        '400': { description: invalid_field }
        '404': { description: Disabled feature or unknown scope }
  /v1/fantasy/municipalities/{municipalityId}/leagues/{leagueId}/cooperation:
    get:
      operationId: cooperationLeague
      description: Account membership required. Authoritative league season; spectators may contribute after joining. Immutable anonymous coverage survives departure, archives freeze new credits.
      security: [{ proposalBearer: [] }]
      parameters:
        - { name: municipalityId, in: path, required: true, schema: { type: string } }
        - { name: leagueId, in: path, required: true, schema: { type: string } }
        - { name: matchdayId, in: query, schema: { type: string } }
      responses:
        '200': { description: League and municipal coverage, content: { application/json: { schema: { $ref: '#/components/schemas/LeagueCooperation' } } } }
        '400': { description: invalid_field }
        '401': { description: account_required or session_expired }
        '404': { description: Disabled feature, unknown scope or membership absent }
  /v1/me/inbox:
    get:
      operationId: cooperationInbox
      description: Verified recipient only. Transactionally drains committed outbox events; immutable server targets and static titles contain no notes, proofs or tokens. No implicit historical events.
      security: [{ proposalBearer: [] }]
      parameters:
        - { name: municipalityId, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 512 }, description: Opaque bounded cursor; must retain municipality filter. }
      responses:
        '200': { description: Persistent account inbox, content: { application/json: { schema: { $ref: '#/components/schemas/CooperationInbox' } } } }
        '400': { description: invalid_field }
        '401': { description: account_required or session_expired }
        '404': { description: Feature disabled }
  /v1/me/inbox/{messageId}/read:
    put:
      operationId: cooperationRead
      security: [{ proposalBearer: [] }]
      parameters:
        - { name: messageId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: false, content: { application/json: { schema: { type: object, additionalProperties: false } } } }
      responses:
        '200':
          description: Naturally idempotent persistent read state
          content:
            application/json:
              schema:
                type: object
                required: [messageId, readAt]
                additionalProperties: false
                properties:
                  messageId: { type: string, format: uuid }
                  readAt: { type: string, format: date-time }
        '400': { description: invalid_field }
        '401': { description: account_required or session_expired }
        '404': { description: Missing message or another recipient }
  /v1/me/followed-places:
    get:
      operationId: cooperationFollows
      security: [{ proposalBearer: [] }]
      parameters:
        - { name: municipalityId, in: query, schema: { type: string } }
      responses:
        '200':
          description: Private account list; GET has no subscription effect
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/FollowedPlace' } }
        '400': { description: invalid_field }
        '401': { description: account_required or session_expired }
        '404': { description: Feature disabled }
  /v1/me/followed-places/{placeId}:
    parameters:
      - { name: placeId, in: path, required: true, schema: { type: string } }
      - { name: municipalityId, in: query, required: true, schema: { type: string } }
    put:
      operationId: cooperationFollow
      security: [{ proposalBearer: [] }]
      requestBody: { required: false, content: { application/json: { schema: { type: object, additionalProperties: false } } } }
      responses:
        '200': { description: Idempotent explicit opt-in, content: { application/json: { schema: { $ref: '#/components/schemas/FollowedPlaceResult' } } } }
        '400': { description: invalid_field }
        '401': { description: account_required or session_expired }
        '404': { description: Unknown public municipality/place or disabled feature }
    delete:
      operationId: cooperationUnfollow
      security: [{ proposalBearer: [] }]
      requestBody: { required: false, content: { application/json: { schema: { type: object, additionalProperties: false } } } }
      responses:
        '200': { description: Idempotent unfollow; historical messages and own integrations retained, content: { application/json: { schema: { $ref: '#/components/schemas/FollowedPlaceResult' } } } }
        '400': { description: invalid_field }
        '401': { description: account_required or session_expired }
        '404': { description: Unknown public municipality/place or disabled feature }
components:
  securitySchemes:
    fantasyAdmin:
      type: apiKey
      in: header
      name: X-Admin-Token
      description: Explicit local operator secret; publication rejects every Origin header.
    proposalBearer:
      type: http
      scheme: bearer
      description: Opaque 32-byte base64url token issued by proposal-session. Store only its hash on the server.
  parameters:
    MunicipalityId:
      name: municipalityId
      in: path
      required: true
      description: "Canonical slug; known comune: aliases are accepted for compatibility."
      schema:
        type: string
    ProblemId:
      name: problemId
      in: path
      required: true
      schema:
        type: string
    TurnId:
      name: turnId
      in: path
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Stable key for one logical write. Replaying the same request with the
        same key returns the original response; reusing it for different input
        returns 409 idempotency_key_reused.
      schema:
        type: string
        minLength: 8
        maxLength: 160
        pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{7,159}$"
  responses:
    Unauthorized:
      description: Missing or invalid local operator credential.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Five invite attempts consumed in the current persisted minute window.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ProposalSessionUnauthorized:
      description: Missing, malformed, unknown or revoked proposal session.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: Invalid JSON, field, enum or query parameter.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Origin is not allowed by the local CORS policy.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Requested municipality, turn, problem or route was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Incompatible domain state or reused idempotency key.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PayloadTooLarge:
      description: JSON body exceeds 64 KiB.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    FantasyOutcome:
      oneOf:
        - $ref: '#/components/schemas/FantasyOutcomeV1'
        - $ref: '#/components/schemas/FantasyOutcomeV2'
    "MeasurementSourceSummary": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "id",
        "label",
        "sourceDate"
      ],
      "properties": {
        "id": {
          "type": "string",
          "maxLength": 128
        },
        "label": {
          "type": "string",
          "maxLength": 128
        },
        "sourceDate": {
          "type": "string",
          "format": "date-time"
        }
      }
    }
    "MeasurementBaseline": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "value",
        "unit",
        "measuredAt",
        "source"
      ],
      "properties": {
        "value": {
          "type": "number",
          "minimum": -1000000000.0,
          "maximum": 1000000000.0
        },
        "unit": {
          "type": "string",
          "maxLength": 64
        },
        "measuredAt": {
          "type": "string",
          "format": "date-time"
        },
        "source": {
          "$ref": "#/components/schemas/MeasurementSourceSummary"
        }
      }
    }
    "MeasurementProblem": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "id",
        "municipalityId",
        "placeId",
        "title",
        "baseline",
        "revision",
        "publishedAt"
      ],
      "properties": {
        "id": {
          "type": "string",
          "format": "uuid"
        },
        "municipalityId": {
          "type": "string",
          "maxLength": 128
        },
        "placeId": {
          "type": "string",
          "maxLength": 128
        },
        "title": {
          "type": "string",
          "maxLength": 200
        },
        "baseline": {
          "$ref": "#/components/schemas/MeasurementBaseline"
        },
        "revision": {
          "type": "integer",
          "minimum": 1
        },
        "publishedAt": {
          "type": "string",
          "format": "date-time"
        }
      }
    }
    "MeasurementProblemCommand": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "idempotencyKey",
        "title",
        "placeId",
        "baseline"
      ],
      "properties": {
        "idempotencyKey": {
          "type": "string",
          "pattern": "^[A-Za-z0-9_-]{8,128}$"
        },
        "title": {
          "type": "string",
          "minLength": 1,
          "maxLength": 200
        },
        "placeId": {
          "type": "string",
