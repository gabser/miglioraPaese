      "operationId": "publishFantasyOutcome"
      "parameters":
        -
          "$ref": "#/components/parameters/MunicipalityId"
        -
          "name": "matchdayId"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
        -
          "name": "cardId"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
      "description": "Published outcomes are immutable version 1 records from an authorized verified catalog source after observation ends. Synthetic provenance remains explicit. Personal points use only frozen eligible snapshots, published outcomes and the server transfer ledger. Final summaries may increase only by a unique structured reflection; cooperative score is unavailable. No client points are accepted. Reading results freezes newly available eligible card results exactly once."
      "responses":
        "200":
          "description": "Authoritative fantasy publication, reveal or reflection result."
          "content":
            "application/json":
              "schema":
