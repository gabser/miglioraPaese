      type: object
      required: [choice]
      properties:
        choice:
          $ref: "#/components/schemas/PredictionChoice"
        motivations:
          type: array
          maxItems: 2
          uniqueItems: true
          items:
            $ref: "#/components/schemas/MotivationKey"
        confidence:
          anyOf:
            - $ref: "#/components/schemas/HypothesisConfidence"
