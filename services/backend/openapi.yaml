  /v1/session:
    delete:
      operationId: eraseFantasySessionData
      security:
        - proposalBearer: []
      description: >-
        Removes fantasy players/teams/results and memberships across municipalities and seasons.
        Owned leagues are archived and invites revoked; other members, public outcomes,
        archived league/ownership audit references remain. Accounts, email, sessions, mission
        notes/proofs/receipts, review/XP and measurement/cooperation history remain intact.
        This is fantasy erasure, not account closure or session revocation. With
        OPS_LOCAL_ENABLED=true it participates in the external HMAC erasure journal;
        pending or invalid journal state blocks readiness/data exposure until reconciled.
        Fantasy is opt-in and returns404 while disabled.
      responses:
        "200":
          description: Scoped fantasy erasure completed; retained classes are described above.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    const: erased
        "401":
          $ref: '#/components/responses/ProposalSessionUnauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
  /v1/proposal-session:
    post:
      operationId: createProposalSession
      description: Bootstrap a new anonymous server-authoritative scope. Persist token before sending proposals; never bootstrap silently to recover an old intent.
      responses:
        "201":
          description: New bearer token and submission scope; no-store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposalSessionBootstrap'
    get:
      operationId: getProposalSession
      parameters:
        - name: submissionScope
          in: query
          description: Optional original receipt scope owned by the active account; guests may select only their own scope.
          schema: { type: string, format: uuid }
      security: [{ proposalBearer: [] }]
      responses:
        "200":
          description: Active scope and capabilities, without returning the token; no-store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposalSession'
        "401":
          description: Session unavailable or revoked.
  /v1/proposal-session/revoke:
    post:
      operationId: revokeProposalSession
      security: [{ proposalBearer: [] }]
      description: Idempotent revocation serialized with scoped proposal commits. Existing public records remain; further writes and private reads using this token fail.
      responses:
        "200":
          description: Revoked, including repeated revocation; no-store.
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked: { const: true }
        "401":
          description: Missing, malformed or unknown session.
  /v1/municipalities/{municipalityId}/submissions/{idempotencyKey}:
    get:
      operationId: lookupSubmission
      security: [{ proposalBearer: [] }]
      description: Original acceptance snapshot in this session and canonical municipality. A 404 does not prove an in-flight POST has stopped. Never resubmit automatically after a missing lookup.
      parameters:
        - name: submissionScope
          in: query
          description: Original owned scope. Required to disambiguate a matching key across multiple account scopes.
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/MunicipalityId'
        - in: path
          name: idempotencyKey
          required: true
          schema: { type: string, minLength: 8, maxLength: 160, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{7,159}$' }
      responses:
        "200":
          description: Original public DTO snapshot, including a proposal later rejected; no-store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuggestedProblem'
        "400":
          description: Invalid key or path encoding.
        "401":
          description: Missing or revoked session.
        "409":
          description: ambiguous_submission_scope; choose the original owned scope.
        "404":
          description: No completed submission in this scope and municipality.
