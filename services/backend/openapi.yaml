        integrationRequestId: { type: string, format: uuid }
        mimeType: { const: image/png }
        totalBytes: { type: integer, minimum: 1, maximum: 2097152 }
        synthetic: { const: true }
        idempotencyKey: { type: string, pattern: '^[A-Za-z0-9_-]{8,128}$' }
    ReviewProofMetadata:
      type: object
      required: [id, sha256, sizeBytes, mimeType, width, height]
      properties:
        id: { type: string, format: uuid }
        sha256: { type: string }
        sizeBytes: { type: integer }
        mimeType: { const: image/png }
        width: { type: integer }
        height: { type: integer }
    IntegrationRequest:
      type: object
      required: [id, message, requestedAt, dueAt, status, revision]
      properties:
        id: { type: string, format: uuid }
        message: { type: string }
        requestedAt: { type: string, format: date-time }
        dueAt: { type: string, format: date-time, description: Server deadline 24 hours after request. }
        status: { type: string, enum: [open, answered, closed] }
        revision: { type: integer, minimum: 1 }
    ObservationSupplement:
      type: object
      required: [id, notes, proofs, submittedAt]
      properties:
        id: { type: string, format: uuid }
        notes: { type: string }
        proofs: { type: array, items: { $ref: '#/components/schemas/ReviewProofMetadata' } }
        submittedAt: { type: string, format: date-time }
    ObservationAudit:
      type: object
      required: [id, action, actorId, reason, at, revision]
      properties:
        id: { type: string, format: uuid }
        action: { type: string }
        actorId: { type: string, format: uuid }
        reason: { type: string }
        at: { type: string, format: date-time }
        revision: { type: integer, minimum: 1 }
    ObservationLive:
      type: object
      required: [id, bookingId, municipalityId, missionId, placeId, windowId, protocolVersion, answer, notes, submittedAt, status, revision, assignedTo, xpAwarded, proofs, integrationRequest, supplements, audit]
      properties:
        id: { type: string, format: uuid }
        bookingId: { type: string, format: uuid }
        municipalityId: { type: string }
        missionId: { type: string }
        placeId: { type: string, description: Persisted server identity shared across missions of the same delineated area. }
        windowId: { type: string }
        protocolVersion: { type: integer, minimum: 1 }
        answer: { type: string, enum: [noIssue, nonObservable, unsure, visibleWaste] }
        notes: { type: string }
        submittedAt: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/ObservationReviewStatus' }
        revision: { type: integer, minimum: 1 }
        assignedTo: { type: [string, 'null'], format: uuid }
        xpAwarded: { type: integer, enum: [0, 10] }
        proofs: { type: array, items: { $ref: '#/components/schemas/ReviewProofMetadata' }, description: Empty in queue for cases assigned to another operator. }
        integrationRequest:
          oneOf:
            - $ref: '#/components/schemas/IntegrationRequest'
            - type: 'null'
        supplements: { type: array, items: { $ref: '#/components/schemas/ObservationSupplement' } }
        audit: { type: array, items: { $ref: '#/components/schemas/ObservationAudit' } }
    ReplicationRequest:
      type: object
      required: [id, authorId, municipalityId, missionId, placeId, windowId, protocolVersion, dueAt, status, bookingId]
      properties:
        id: { type: string, format: uuid }
        authorId: { type: string, format: uuid }
        municipalityId: { type: string }
        missionId: { type: string }
        placeId: { type: string }
        windowId: { type: string }
        protocolVersion: { type: integer, minimum: 1 }
        dueAt: { type: string, format: date-time, description: No later than the persisted mission window end. }
        status: { type: string, enum: [open, booked] }
        bookingId: { type: [string, 'null'], format: uuid, description: Persisted replica booking ID for author recovery across devices; null until booked. }
    XpEvent:
      type: object
      required: [id, observationId, placeId, windowId, amount, awardedAt, ruleVersion, replicationRequestId]
      properties:
        id: { type: string, format: uuid }
        observationId: { type: string, format: uuid }
        placeId: { type: string }
        windowId: { type: string }
        amount: { const: 10 }
        awardedAt: { type: string, format: date-time }
        ruleVersion: { const: 1 }
        replicationRequestId: { type: [string, 'null'], format: uuid }
    XpLedger:
      type: object
      required: [balance, items]
      properties:
        balance: { type: integer, minimum: 0 }
        items: { type: array, items: { $ref: '#/components/schemas/XpEvent' } }
    "FantasyInvitePreviewRequest": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "token"
      ],
      "properties": {
        "token": {
          "type": "string",
          "pattern": "^[A-Za-z0-9_-]{43}$"
        }
      }
    }
    "FantasyInvitePreview": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "serverTime",
        "seasonId",
        "leagueId",
        "municipalityId",
        "name",
        "leagueRevision",
        "expiresAt",
        "firstLocksAt",
        "expectedRole",
        "lateJoinReason"
      ],
      "properties": {
        "serverTime": {
          "type": "string",
          "format": "date-time"
        },
        "seasonId": {
          "type": "string"
        },
        "leagueId": {
          "type": "string"
        },
        "municipalityId": {
          "type": "string"
        },
        "name": {
          "type": "string",
          "enum": [
            "Amici",
            "Quartiere",
            "Comune"
          ]
        },
        "leagueRevision": {
          "type": "integer",
          "minimum": 1
        },
        "expiresAt": {
          "type": "string",
          "format": "date-time"
        },
        "firstLocksAt": {
          "type": "string",
          "format": "date-time"
        },
        "expectedRole": {
          "type": "string",
          "enum": [
            "competitor",
            "spectator"
          ]
        },
        "lateJoinReason": {
          "type": [
            "string",
            "null"
          ],
          "enum": [
            "firstLockReached",
            "snapshotFrozen",
            null
          ]
        }
      }
    }
    "FantasyOwnershipCandidate": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "memberId",
        "pseudonym"
      ],
      "properties": {
        "memberId": {
          "type": "string"
        },
        "pseudonym": {
          "type": "string"
        }
      }
    }
    "FantasyOwnershipOffer": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "id",
        "targetMemberId",
        "targetPseudonym",
        "status",
        "expiresAt",
        "isTarget"
      ],
      "properties": {
        "id": {
          "type": "string"
        },
        "targetMemberId": {
          "type": "string"
        },
        "targetPseudonym": {
          "type": "string"
        },
        "status": {
          "type": "string",
          "enum": [
            "pending",
            "accepted",
            "revoked",
            "expired",
            "cancelled"
          ]
        },
        "expiresAt": {
          "type": "string",
          "format": "date-time"
        },
        "isTarget": {
          "type": "boolean"
        }
      }
    }
    "FantasyOwnershipWorkspace": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "serverTime",
        "seasonId",
        "leagueId",
        "revision",
        "isOwner",
        "candidates",
        "pendingOffer"
      ],
      "properties": {
        "serverTime": {
          "type": "string",
          "format": "date-time"
        },
        "seasonId": {
          "type": "string"
        },
        "leagueId": {
          "type": "string"
        },
        "revision": {
          "type": "integer",
          "minimum": 1
        },
        "isOwner": {
          "type": "boolean"
        },
        "candidates": {
          "type": "array",
          "items": {
            "$ref": "#/components/schemas/FantasyOwnershipCandidate"
          }
        },
