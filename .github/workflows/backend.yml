name: Backend

on:
  push:
    branches: [main]
    paths:
      - "services/backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test backend
        working-directory: services/backend
        run: npm test
