name: Flutter

on:
  push:
    branches: [main]
    paths-ignore:
      - "services/backend/**"
      - "docs/backend/**"
      - ".github/workflows/backend.yml"
      - "README.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "services/backend/**"
      - "docs/backend/**"
      - ".github/workflows/backend.yml"
      - "README.md"

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test
